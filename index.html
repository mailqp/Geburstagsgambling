<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoPlant Control</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    background:
        radial-gradient(circle at top left,#2aff8a22,transparent 35%),
        radial-gradient(circle at bottom right,#00ffcc22,transparent 40%),
        linear-gradient(135deg,#07130f,#0b2018 45%,#05110d);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(100,255,180,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,255,180,.04) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:40px 0;
}

header{
    text-align:center;
    margin-bottom:40px;
}

header h1{
    font-size:3rem;
    letter-spacing:3px;
    color:#9effcb;
    text-shadow:0 0 20px #32ff9c88;
}

header p{
    color:#b6ffd7;
    opacity:.8;
    margin-top:10px;
}

.plants{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:28px;
}

.card{
    position:relative;
    height:310px;
    border-radius:32px;
    background:rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
    border:1px solid rgba(120,255,180,.18);
    cursor:pointer;
    transition:.35s;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 0 30px rgba(64,255,170,.25);
}

.glow{
    position:absolute;
    width:180px;
    height:180px;
    background:radial-gradient(circle,#35ff9d55,transparent 70%);
    border-radius:50%;
    top:-60px;
    right:-60px;
}

.plant{
    font-size:90px;
    text-align:center;
    margin-top:45px;
    filter: drop-shadow(0 0 12px #53ffaf77);
}

.card h2{
    text-align:center;
    margin-top:10px;
    color:#d8ffe9;
}

.card span{
    display:block;
    text-align:center;
    color:#98d9b4;
    margin-top:8px;
    font-size:.9rem;
}

.status{
    margin-top:40px;
    border-radius:34px;
    padding:28px;
    background:rgba(255,255,255,.07);
    backdrop-filter: blur(20px);
    border:1px solid rgba(120,255,180,.2);
    display:none;
    animation:fade .4s;
}

.status.active{
    display:block;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

.top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:25px;
}

.icon{
    width:80px;
    height:80px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    background:rgba(70,255,170,.12);
    box-shadow: inset 0 0 20px rgba(70,255,170,.12);
}

.metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.metric{
    background:rgba(255,255,255,.05);
    border-radius:22px;
    padding:20px;
}

.metric small{
    color:#8fd8af;
}

.metric h3{
    font-size:2rem;
    color:#b9ffd8;
    margin-top:8px;
}

.bar{
    height:12px;
    border-radius:30px;
    background:#163326;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:100%;
    border-radius:30px;
    background:linear-gradient(90deg,#38ff9c,#8bffcb);
    box-shadow:0 0 12px #38ff9c;
}

.footer{
    margin-top:20px;
    color:#8fd8af;
    font-size:.9rem;
    text-align:right;
}

@media(max-width:700px){
    header h1{font-size:2.2rem;}
    .metrics{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">

<header>
<h1>🌿 NEOPLANT CONTROL</h1>
<p>Futuristische Pflanzenüberwachung • Version 1.0</p>
</header>

<section class="plants">

<div class="card" onclick="showPlant(0)">
<div class="glow"></div>
<div class="plant">🪴</div>
<h2>Monstera Nova</h2>
<span>Tippen für Status</span>
</div>

<div class="card" onclick="showPlant(1)">
<div class="glow"></div>
<div class="plant">🌿</div>
<h2>Calathea Orion</h2>
<span>Tippen für Status</span>
</div>

<div class="card" onclick="showPlant(2)">
<div class="glow"></div>
<div class="plant">🌱</div>
<h2>Ficus Zenith</h2>
<span>Tippen für Status</span>
</div>

</section>

<section class="status active" id="statusBox">

<div class="top">
<div class="icon" id="plantIcon">🪴</div>
<div>
<h2 id="plantName">Monstera Nova</h2>
<p id="plantType">Biologische Einheit A-01</p>
</div>
</div>

<div class="metrics">

<div class="metric">
<small>Trockenheit</small>
<h3 id="dryValue">68%</h3>
<div class="bar">
<div class="fill" id="dryBar" style="width:68%"></div>
</div>
</div>

<div class="metric">
<small>Letztes Gießen</small>
<h3 id="waterValue">2 Tage</h3>
<div class="bar">
<div class="fill" style="width:100%"></div>
</div>
</div>

</div>

<div class="footer">
Sensorwerte sind Platzhalter
</div>

</section>

</div>

<script>
const plants = [
{
icon:"🪴",
name:"Monstera Nova",
type:"Biologische Einheit A-01",
dry:68,
water:"2 Tage"
},
{
icon:"🌿",
name:"Calathea Orion",
type:"Hydro Flora B-12",
dry:41,
water:"5 Tage"
},
{
icon:"🌱",
name:"Ficus Zenith",
type:"Eco Tree Z-07",
dry:83,
water:"1 Tag"
}
];

function showPlant(index){
const p = plants[index];

document.getElementById("plantIcon").innerHTML = p.icon;
document.getElementById("plantName").innerHTML = p.name;
document.getElementById("plantType").innerHTML = p.type;
document.getElementById("dryValue").innerHTML = p.dry + "%";
document.getElementById("waterValue").innerHTML = p.water;
document.getElementById("dryBar").style.width = p.dry + "%";

document.getElementById("statusBox").classList.add("active");
}
</script>

</body>
</html>
