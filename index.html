<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Birthday Case Opening</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {

    background:

        radial-gradient(
            ellipse at 50% -20%,
            rgba(65, 88, 112, .30),
            transparent 55%
        ),

        radial-gradient(
            ellipse at 50% 100%,
            rgba(0, 0, 0, .85),
            transparent 60%
        ),

        #080b0f;

    color: #e7ebef;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

}


/* =========================================================
   BACKGROUND
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .16;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 60px 60px;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 42px;

    background:

        linear-gradient(
            180deg,
            rgba(20,27,35,.98),
            rgba(9,13,18,.98)
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.45);

    position: relative;

    z-index: 10;

}


.logo {

    font-size: 17px;

    font-weight: 800;

    letter-spacing: 2px;

}


.logo span {
    color: #65a4d8;
}


.top-right {

    display: flex;

    align-items: center;

    gap: 12px;

    color: #75818d;

    font-size: 11px;

    letter-spacing: 1px;

    text-transform: uppercase;

}


.avatar {

    width: 31px;

    height: 31px;

    background:

        linear-gradient(
            135deg,
            #304253,
            #121920
        );

    border:
        1px solid
        #465767;

    border-radius: 3px;

}


/* =========================================================
   MAIN
========================================================= */

.main {

    width:
        min(1350px, 94vw);

    margin: 0 auto;

    padding-top: 45px;

    padding-bottom: 80px;

}


.title {

    text-align: center;

    margin-bottom: 34px;

}


.title h1 {

    font-size: 27px;

    font-weight: 500;

    letter-spacing: 3px;

    text-transform: uppercase;

}


.title p {

    margin-top: 9px;

    color: #697681;

    font-size: 13px;

}


/* =========================================================
   CASE
========================================================= */

.case-area {

    height: 220px;

    display: flex;

    justify-content: center;

    align-items: center;

}


.case {

    width: 330px;

    height: 190px;

    object-fit: contain;

    filter:

        drop-shadow(
            0 30px 35px
            rgba(0,0,0,.65)
        );

    transition:
        transform .3s ease;

}


.case:hover {

    transform:
        translateY(-5px)
        scale(1.015);

}


.case.opening {

    animation:
        shake
        .09s
        infinite
        alternate;

}


@keyframes shake {

    from {

        transform:
            translateX(-3px)
            rotate(-.7deg);

    }

    to {

        transform:
            translateX(3px)
            rotate(.7deg);

    }

}


/* =========================================================
   ROULETTE FRAME
========================================================= */

.roulette-frame {

    position: relative;

    background:

        linear-gradient(
            180deg,
            #141c24,
            #0b1016
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    padding: 8px;

    box-shadow:

        inset
        0 1px
        rgba(255,255,255,.05),

        0 20px 60px
        rgba(0,0,0,.5);

}


/* =========================================================
   ROULETTE
========================================================= */

.roulette {

    height: 225px;

    overflow: hidden;

    position: relative;

    background:

        linear-gradient(
            180deg,
            rgba(255,255,255,.018),
            rgba(0,0,0,.32)
        );

}


/* =========================================================
   SIDE FADES
========================================================= */

.roulette::before,
.roulette::after {

    content: "";

    position: absolute;

    top: 0;

    bottom: 0;

    width: 260px;

    z-index: 20;

    pointer-events: none;

}


.roulette::before {

    left: 0;

    background:

        linear-gradient(
            90deg,
            #0b1016 0%,
            rgba(11,16,22,.94) 30%,
            transparent 100%
        );

}


.roulette::after {

    right: 0;

    background:

        linear-gradient(
            270deg,
            #0b1016 0%,
            rgba(11,16,22,.94) 30%,
            transparent 100%
        );

}


/* =========================================================
   CENTER MARKER
========================================================= */

.marker {

    position: absolute;

    top: 0;

    bottom: 0;

    left: 50%;

    width: 2px;

    transform:
        translateX(-50%);

    background: #ffffff;

    z-index: 40;

    box-shadow:

        0 0 8px white,

        0 0 18px
        rgba(255,255,255,.45);

}


.marker::before {

    content: "";

    position: absolute;

    top: 0;

    left: 50%;

    transform:
        translateX(-50%);

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-top:
        12px solid white;

}


.marker::after {

    content: "";

    position: absolute;

    bottom: 0;

    left: 50%;

    transform:
        translateX(-50%)
        rotate(180deg);

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-top:
        12px solid white;

}


/* =========================================================
   ITEMS
========================================================= */

.items {

    position: absolute;

    left: 50%;

    top: 0;

    height: 100%;

    display: flex;

    align-items: center;

    gap: 3px;

    will-change: transform;

}


/* =========================================================
   ITEM
========================================================= */

.item {

    width: 165px;

    min-width: 165px;

    height: 194px;

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            #19222b,
            #0c1218
        );

    border:
        1px solid
        rgba(255,255,255,.055);

    box-shadow:

        inset
        0 0 30px
        rgba(0,0,0,.25);

}


.item::before {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 3px;

}


.blue::before {
    background: #4b69ff;
}


.purple::before {
    background: #8847ff;
}


.pink::before {
    background: #d32ce6;
}


.red::before {
    background: #eb4b4b;
}


.gold::before {
    background: #e4ae39;
}


/* =========================================================
   WEAPON
========================================================= */

.weapon {

    position: absolute;

    width: 150px;

    height: 120px;

    object-fit: contain;

    left: 50%;

    top: 47%;

    transform:
        translate(
            -50%,
            -50%
        );

    filter:

        drop-shadow(
            0 8px 9px
            rgba(0,0,0,.65)
        );

    user-select: none;

    pointer-events: none;

}


/* =========================================================
   ITEM TEXT
========================================================= */

.item-info {

    position: absolute;

    left: 10px;

    bottom: 10px;

    z-index: 5;

    line-height: 1.15;

}


.item-info strong {

    display: block;

    color: #dce1e5;

    font-size: 11px;

    font-weight: 500;

}


.item-info span {

    display: block;

    margin-top: 4px;

    color: #707c88;

    font-size: 9px;

}


/* =========================================================
   GOLD
========================================================= */

.gold {

    background:

        radial-gradient(
            circle at center,
            rgba(228,174,57,.12),
            transparent 65%
        ),

        linear-gradient(
            145deg,
            #1c1b18,
            #0b0d0f
        );

    box-shadow:

        inset
        0 0 45px
        rgba(228,174,57,.08);

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    text-align: center;

    margin-top: 26px;

}


.open-button {

    min-width: 245px;

    padding: 15px 30px;

    border:
        1px solid
        #526b81;

    background:

        linear-gradient(
            180deg,
            #2b4052,
            #172530
        );

    color: #edf1f4;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1.5px;

    cursor: pointer;

    box-shadow:

        inset
        0 1px
        rgba(255,255,255,.1),

        0 8px 25px
        rgba(0,0,0,.4);

    transition: .15s;

}


.open-button:hover {

    background:

        linear-gradient(
            180deg,
            #355168,
            #1c2c3a
        );

}


.open-button:disabled {

    opacity: .45;

    cursor: default;

}


.info {

    margin-top: 12px;

    color: #5e6a76;

    font-size: 10px;

    letter-spacing: 1px;

}


/* =========================================================
   RESULT
========================================================= */

.result {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    background:

        radial-gradient(
            circle at center,
            rgba(228,174,57,.16),
            transparent 30%
        ),

        rgba(4,6,8,.97);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .7s;

}


.result.show {

    opacity: 1;

    pointer-events: auto;

}


.result-content {

    text-align: center;

    opacity: 0;

    transform:
        scale(.7)
        translateY(25px);

    transition:

        1s cubic-bezier(
            .16,
            1,
            .3,
            1
        );

}


.result.show
.result-content {

    opacity: 1;

    transform:
        scale(1)
        translateY(0);

}


.result-rarity {

    color: #e1ad3c;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 4px;

    margin-bottom: 5px;

}


.result-image {

    width:
        min(620px, 90vw);

    height: 350px;

    object-fit: contain;

    filter:

        drop-shadow(
            0 0 20px
            rgba(140,70,255,.4)
        )

        drop-shadow(
            0 30px 35px
            rgba(0,0,0,.85)
        );

    animation:

        floatKnife
        3.5s
        ease-in-out
        infinite;

}


@keyframes floatKnife {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-1deg);

    }

    50% {

        transform:
            translateY(-9px)
            rotate(1deg);

    }

}


.result-name {

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 2px;

}


.result-name .star {

    color: #e1ad3c;

}


.result-skin {

    margin-top: 7px;

    color: #949ba4;

    font-size: 13px;

}

</style>

</head>

<body>

<div class="topbar">

    <div class="logo">BIRTHDAY <span>CASE</span></div>

    <div class="top-right">
        <span>BALANCE</span>
        <div class="avatar"></div>
    </div>

</div>

<div class="main">

    <div class="title">
        <h1>CASE OPENING</h1>
        <p>ÖFFNE DEINE ERSTEN FÄLLE UND GEWINNE PRÄHISTORISCHE WAFFEN</p>
    </div>

    <div class="case-area">
        <img src="case.png" alt="Case" class="case" id="case">
    </div>

    <div class="roulette-frame" id="rouletteFrame">
        <div class="roulette">
            <div class="marker"></div>
            <div class="items" id="items"></div>
        </div>
    </div>

    <div class="controls">
        <button class="open-button" id="openBtn">ÖFFNEN</button>
        <p class="info">KLICKE AUF DEN KNOPF UM DEIN GLÜCK ZU VERSUCHEN</p>
    </div>

</div>

<div class="result" id="result">
    <div class="result-content">
        <div class="result-rarity" id="resultRarity"></div>
        <img src="" alt="Result" class="result-image" id="resultImage">
        <div class="result-name" id="resultName"></div>
        <div class="result-skin" id="resultSkin"></div>
    </div>
</div>

<script>

const caseImg = document.getElementById('case');
const openBtn = document.getElementById('openBtn');
const itemsContainer = document.getElementById('items');
const result = document.getElementById('result');
const resultRarity = document.getElementById('resultRarity');
const resultImage = document.getElementById('resultImage');
const resultName = document.getElementById('resultName');
const resultSkin = document.getElementById('resultSkin');

const weapons = [
    { name: 'AK-47', skin: 'Dragon Lore', image: 'ak47.png', rarity: 'MYTHICAL', color: 'gold' },
    { name: 'M4A4', skin: 'Howl', image: 'm4a4.png', rarity: 'RARE', color: 'red' },
    { name: 'AWP Dragon Lore', skin: 'Dragon Lore', image: 'awp.png', rarity: 'LEGENDARY', color: 'gold' },
    { name: 'Karambit', skin: 'Gamma Doppler', image: 'karambit.png', rarity: 'RARE', color: 'red' },
    {
        name: '★ Rare Special Item ★',
        skin: '',
        image: 'special.png',
        rarity: 'RARE SPECIAL',
        color: 'purple'
    },
];

function createItems() {
    itemsContainer.innerHTML = '';
    for (let i = 0; i < 30; i++) {
        const weapon = weapons[i % weapons.length];
        const item = document.createElement('div');
        item.className = `item ${weapon.color}`;
        item.innerHTML = `
            <img src="${weapon.image}" alt="${weapon.name}" class="weapon">
            <div class="item-info">
                <strong>
                    ${weapon.name}
                </strong>

                <span>
                    ${weapon.skin}
                </span>

            </div>
        `;
        itemsContainer.appendChild(item);
    }
}

function spin() {
    const randomIndex = Math.floor(Math.random() * weapons.length);
    const selectedWeapon = weapons[randomIndex];

    const itemWidth = 165 + 3;
    const offset = randomIndex * itemWidth + (itemWidth / 2);
    const distance = 30 * itemWidth;
    const finalPosition = distance - offset;

    itemsContainer.style.transition = 'none';
    itemsContainer.style.transform = 'translateX(0)';

    setTimeout(() => {
        itemsContainer.style.transition = 'transform 4s cubic-bezier(.17,.67,.12,.98)';
        itemsContainer.style.transform = `translateX(-${finalPosition}px)`;
    }, 50);

    setTimeout(() => {
        showResult(selectedWeapon);
    }, 4000);
}

function showResult(weapon) {
    resultRarity.textContent = weapon.rarity;
    resultImage.src = weapon.image;
    resultName.innerHTML = weapon.name + ' <span class="star">★</span>';
    resultSkin.textContent = weapon.skin;
    result.classList.add('show');
    openBtn.disabled = false;
}

openBtn.addEventListener('click', () => {
    openBtn.disabled = true;
    caseImg.classList.add('opening');
    spin();
});

result.addEventListener('click', () => {
    result.classList.remove('show');
});

createItems();

</script>

</body>

</html>
