<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Birthday Case Opening</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    min-height: 100%;

}


body {

    background:

        radial-gradient(
            ellipse at 50% -10%,
            rgba(55, 76, 98, .32),
            transparent 55%
        ),

        radial-gradient(
            ellipse at 50% 100%,
            rgba(0, 0, 0, .95),
            transparent 65%
        ),

        #080b0f;

    color: #e7ebef;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

}


/* =========================================================
   BACKGROUND GRID
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .13;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 60px 60px;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 42px;

    background:

        linear-gradient(
            180deg,
            rgba(20,27,35,.98),
            rgba(9,13,18,.98)
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.45);

    position: relative;

    z-index: 50;

}


.logo {

    font-size: 17px;

    font-weight: 800;

    letter-spacing: 2px;

}


.logo span {

    color: #65a4d8;

}


.top-right {

    display: flex;

    align-items: center;

    gap: 12px;

    color: #75818d;

    font-size: 11px;

    letter-spacing: 1px;

    text-transform: uppercase;

}


.avatar {

    width: 31px;

    height: 31px;

    background:

        linear-gradient(
            135deg,
            #304253,
            #121920
        );

    border:
        1px solid
        #465767;

    border-radius: 3px;

}


/* =========================================================
   MAIN
========================================================= */

.main {

    width:
        min(1450px, 95vw);

    margin: 0 auto;

    padding-top: 45px;

    padding-bottom: 80px;

}


/* =========================================================
   TITLE
========================================================= */

.title {

    text-align: center;

    margin-bottom: 30px;

}


.title h1 {

    font-size: 27px;

    font-weight: 500;

    letter-spacing: 3px;

    text-transform: uppercase;

}


.title p {

    margin-top: 9px;

    color: #697681;

    font-size: 13px;

}


/* =========================================================
   CASE STAGE
========================================================= */

.case-stage {

    height: 430px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    transition:

        height .9s ease,

        opacity .6s ease;

}


/* =========================================================
   CASE
========================================================= */

.case {

    width: 520px;

    height: 330px;

    object-fit: contain;

    filter:

        drop-shadow(
            0 35px 45px
            rgba(0,0,0,.75)
        )

        drop-shadow(
            0 0 30px
            rgba(70,100,130,.08)
        );

    transition:

        transform .8s
        cubic-bezier(.16,1,.3,1),

        opacity .6s ease,

        filter .5s ease;

}


.case:hover {

    transform:
        translateY(-7px)
        scale(1.015);

}


.case.opening {

    animation:
        caseOpen
        1.1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

}


@keyframes caseOpen {

    0% {

        transform:
            scale(1)
            rotate(0deg);

        filter:

            drop-shadow(
                0 35px 45px
                rgba(0,0,0,.75)
            );

    }

    20% {

        transform:
            scale(1.035)
            rotate(-1deg);

    }

    35% {

        transform:
            scale(1.03)
            rotate(1deg);

    }

    50% {

        transform:
            scale(1.06)
            rotate(-.5deg);

    }

    100% {

        transform:
            scale(.45)
            translateY(-80px);

        opacity: 0;

    }

}


/* =========================================================
   ROULETTE AREA
========================================================= */

.roulette-section {

    opacity: 0;

    transform:
        translateY(80px)
        scale(.96);

    pointer-events: none;

    transition:

        opacity .8s
        cubic-bezier(.16,1,.3,1),

        transform .9s
        cubic-bezier(.16,1,.3,1);

}


.roulette-section.visible {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;

}


/* =========================================================
   ROULETTE FRAME
========================================================= */

.roulette-frame {

    position: relative;

    background:

        linear-gradient(
            180deg,
            #141c24,
            #0b1016
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    padding: 8px;

    box-shadow:

        inset
        0 1px
        rgba(255,255,255,.05),

        0 20px 60px
        rgba(0,0,0,.6);

}


/* =========================================================
   ROULETTE
========================================================= */

.roulette {

    height: 235px;

    overflow: hidden;

    position: relative;

    background:

        linear-gradient(
            180deg,
            rgba(255,255,255,.018),
            rgba(0,0,0,.32)
        );

}


/* =========================================================
   ROULETTE SIDE BLUR
========================================================= */

.roulette::before,
.roulette::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:270px;
    z-index:25;
    backdrop-filter:blur(2px);
}

.roulette::before{
    left:0;
    background:linear-gradient(
        90deg,
        rgba(8,11,15,.92),
        rgba(8,11,15,.55),
        transparent
    );
}

.roulette::after{
    right:0;
    background:linear-gradient(
        270deg,
        rgba(8,11,15,.92),
        rgba(8,11,15,.55),
        transparent
    );
}

/* =========================================================
   ITEMS
========================================================= */

.items {

    position: absolute;

    left: 50%;

    top: 0;

    height: 100%;

    display: flex;

    align-items: center;

    gap: 3px;

    will-change: transform;

}


/* =========================================================
   ITEM
========================================================= */

.item {

    width: 165px;

    min-width: 165px;

    height: 204px;

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:

        inset
        0 0 40px
        rgba(0,0,0,.35);

    transition:
        filter .2s;

}


/* =========================================================
   RARITY BACKGROUNDS
========================================================= */

.item.blue {

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(75,105,255,.26),
            rgba(75,105,255,.08) 45%,
            rgba(7,13,25,.95) 100%
        );

}


.item.purple {

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(136,71,255,.28),
            rgba(136,71,255,.08) 45%,
            rgba(7,13,25,.95) 100%
        );

}


.item.pink {

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(211,44,230,.30),
            rgba(211,44,230,.08) 45%,
            rgba(7,13,25,.95) 100%
        );

}


.item.red {

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(235,75,75,.31),
            rgba(235,75,75,.08) 45%,
            rgba(7,13,25,.95) 100%
        );

}


.item.gold {

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(228,174,57,.32),
            rgba(228,174,57,.09) 45%,
            rgba(18,15,8,.96) 100%
        );

}


/* =========================================================
   RARITY BOTTOM LINE
========================================================= */

.item::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 3px;

}


.item.blue::after {

    background: #4b69ff;

    box-shadow:
        0 0 10px
        rgba(75,105,255,.65);

}


.item.purple::after {

    background: #8847ff;

    box-shadow:
        0 0 10px
        rgba(136,71,255,.65);

}


.item.pink::after {

    background: #d32ce6;

    box-shadow:
        0 0 10px
        rgba(211,44,230,.65);

}


.item.red::after {

    background: #eb4b4b;

    box-shadow:
        0 0 10px
        rgba(235,75,75,.65);

}


.item.gold::after {

    background: #e4ae39;

    box-shadow:
        0 0 14px
        rgba(228,174,57,.8);

}


/* =========================================================
   WEAPON IMAGE
========================================================= */

.weapon {

    position: absolute;

    width: 150px;

    height: 125px;

    object-fit: contain;

    left: 50%;

    top: 44%;

    transform:
        translate(
            -50%,
            -50%
        );

    filter:

        drop-shadow(
            0 9px 10px
            rgba(0,0,0,.75)
        );

    user-select: none;

    pointer-events: none;

}


/* =========================================================
   ITEM INFO
========================================================= */

.item-info {

    position: absolute;

    left: 10px;

    right: 7px;

    bottom: 10px;

    z-index: 5;

    line-height: 1.15;

}


.item-info strong {

    display: block;

    color: #e1e5e8;

    font-size: 11px;

    font-weight: 500;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.item-info span {

    display: block;

    margin-top: 4px;

    color: rgba(255,255,255,.45);

    font-size: 9px;

}


/* =========================================================
   FOCUS / MAGNIFIER
========================================================= */
.focus{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:190px;
    height:190px;
    border-radius:50%;
    pointer-events:none;
    z-index:40;
    opacity:0;
    transition:opacity .6s ease;
}

.focus.visible{
    opacity:1;
}

.focus::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.92);
    box-shadow:
        0 0 0 2px rgba(255,255,255,.08),
        0 0 35px rgba(255,255,255,.18),
        inset 0 0 40px rgba(255,255,255,.06);
    backdrop-filter:blur(.5px);
}

.focus::after{
    content:"";
    position:absolute;
    width:78px;
    height:8px;
    right:-42px;
    bottom:28px;
    border-radius:8px;
    transform:rotate(40deg);
    background:linear-gradient(90deg,#d8dde2,#717b84);
    box-shadow:0 3px 10px rgba(0,0,0,.5);
}


.focus.visible {

    opacity: 1;

}


/* =========================================================
   MAGNIFIER GLASS
========================================================= */

.focus-glass {

    position: absolute;

    top: 8px;

    bottom: 8px;

    left: 0;

    right: 0;

    border-left:
        1px solid
        rgba(255,255,255,.18);

    border-right:
        1px solid
        rgba(255,255,255,.18);

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.075),
            rgba(255,255,255,.035)
        );

    box-shadow:

        inset
        0 0 25px
        rgba(255,255,255,.04),

        0 0 25px
        rgba(0,0,0,.25);

}


/* =========================================================
   MAGNIFIER HANDLE
========================================================= */

.focus::after {

    content: "";

    position: absolute;

    width: 34px;

    height: 5px;

    left: 50%;

    bottom: -14px;

    transform:
        translateX(-50%)
        rotate(90deg);

    background:

        linear-gradient(
            90deg,
            #6d7780,
            #d5d9dc,
            #6d7780
        );

    border-radius: 3px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.6);

}


/* =========================================================
   MAGNIFIER TOP / BOTTOM
========================================================= */

.focus-glass::before {

    content: "";

    position: absolute;

    left: 50%;

    top: -2px;

    transform:
        translateX(-50%);

    width: 0;

    height: 0;

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-top:
        12px solid rgba(255,255,255,.95);

    filter:
        drop-shadow(
            0 0 4px
            rgba(255,255,255,.7)
        );

}


/* =========================================================
   CENTER HIGHLIGHT
========================================================= */

.focus-glass::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -2px;

    transform:
        translateX(-50%)
        rotate(180deg);

    width: 0;

    height: 0;

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-top:
        12px solid rgba(255,255,255,.95);

    filter:
        drop-shadow(
            0 0 4px
            rgba(255,255,255,.7)
        );

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    text-align: center;

    margin-top: 26px;

}


.open-button {

    min-width: 270px;

    padding: 15px 30px;

    border:
        1px solid
        #526b81;

    background:

        linear-gradient(
            180deg,
            #2b4052,
            #172530
        );

    color: #edf1f4;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1.5px;

    cursor: pointer;

    box-shadow:

        inset
        0 1px
        rgba(255,255,255,.1),

        0 8px 25px
        rgba(0,0,0,.4);

    transition:
        .15s;

}


.open-button:hover {

    background:

        linear-gradient(
            180deg,
            #355168,
            #1c2c3a
        );

    transform:
        translateY(-1px);

}


.open-button:disabled {

    opacity: .45;

    cursor: default;

    transform: none;

}


.info {

    margin-top: 12px;

    color: #5e6a76;

    font-size: 10px;

    letter-spacing: 1px;

}


/* =========================================================
   RESULT
========================================================= */

.result {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    background:

        radial-gradient(
            circle at center,
            rgba(228,174,57,.16),
            transparent 30%
        ),

        rgba(4,6,8,.97);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .7s;

}


.result.show {

    opacity: 1;

    pointer-events: auto;

}


.result-content {

    text-align: center;

    opacity: 0;

    transform:
        scale(.7)
        translateY(25px);

    transition:

        1s cubic-bezier(
            .16,
            1,
            .3,
            1
        );

}


.result.show
.result-content {

    opacity: 1;

    transform:
        scale(1)
        translateY(0);

}


.result-rarity {

    color: #e1ad3c;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 4px;

    margin-bottom: 5px;

}


.result-image {

    width:
        min(620px, 90vw);

    height: 350px;

    object-fit: contain;

    filter:

        drop-shadow(
            0 0 20px
            rgba(140,70,255,.4)
        )

        drop-shadow(
            0 30px 35px
            rgba(0,0,0,.85)
        );

    animation:

        floatKnife
        3.5s
        ease-in-out
        infinite;

}


@keyframes floatKnife {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-1deg);

    }

    50% {

        transform:
            translateY(-9px)
            rotate(1deg);

    }

}


.result-name {

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 2px;

}


.result-name .star {

    color: #e1ad3c;

}


.result-skin {

    margin-top: 7px;

    color: #b48be1;

    font-size: 19px;

    letter-spacing: 1px;

}


.result-wear {

    margin-top: 13px;

    color: #697682;

    font-size: 11px;

}


.inspect {

    margin-top: 28px;

    padding: 11px 30px;

    border:
        1px solid
        #4d5a66;

    background: #151b21;

    color: #dce1e5;

    cursor: pointer;

    letter-spacing: 1px;

}


/* =========================================================
   FLASH
========================================================= */

.flash {

    position: fixed;

    inset: 0;

    background: white;

    z-index: 200;

    opacity: 0;

    pointer-events: none;

}


.flash.active {

    animation:
        flash
        .55s
        ease-out;

}


@keyframes flash {

    0% {
        opacity: .85;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: fixed;

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background: #e4ae39;

    z-index: 210;

    pointer-events: none;

    animation:
        particle
        1.6s
        ease-out
        forwards;

}


@keyframes particle {

    from {

        transform:
            translate(0,0)
            scale(1);

        opacity: 1;

    }

    to {

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity: 0;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .topbar {

        padding: 0 16px;

    }


    .top-right {

        display: none;

    }


    .main {

        padding-top: 25px;

    }


    .case-stage {

        height: 350px;

    }


    .case {

        width: 350px;

        height: 260px;

    }


    .item {

        width: 140px;

        min-width: 140px;

    }


    .weapon {

        width: 125px;

        height: 105px;

    }


    .roulette {

        height: 210px;

    }


    .focus {

        width: 150px;

    }


    .result-image {

        height: 240px;

    }


    .result-name {

        font-size: 22px;

    }

}

.item{
    transition:transform .25s ease, filter .25s ease;
 }

 .item.active{
     transform:scale(1.08);
     z-index:5;
     filter:brightness(1.08);
}

</style>

</head>

</div>

/* =========================================================
   RANDOM SKIN
========================================================= */

function randomSkin() {

    return skins[
        Math.floor(
            Math.random()
            *
            skins.length
        )
    ];

}


/* =========================================================
   AUDIO
========================================================= */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


function tick(volume = .04) {

    if (!audioContext)
        return;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        "square";


    oscillator.frequency.value =
        220 +
        Math.random() * 80;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .045
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime
        +
        .05
    );

}


function victorySound() {

    if (!audioContext)
        return;


    const notes = [
        392,
        494,
        587,
        784,
        988
    ];


    notes.forEach(
        (frequency,index) => {

            const osc =
                audioContext
                    .createOscillator();


            const gain =
                audioContext
                    .createGain();


            const start =
                audioContext.currentTime
                +
                index * .11;


            osc.type =
                "sine";


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0,
                start
            );


            gain.gain.linearRampToValueAtTime(
                .14,
                start + .03
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                start + .65
            );


            osc.connect(gain);

            gain.connect(
                audioContext.destination
            );


            osc.start(start);


            osc.stop(
                start + .7
            );

        }
    );

}


/* =========================================================
   CREATE ITEM
========================================================= */

function createItem(skin) {

    const item =
        document.createElement("div");


    item.className =
        `item ${skin.rarity}`;


    item.innerHTML = `

        <img
            class="weapon"
            src="${skin.image}"
            alt="${skin.name}"
        >

        <div class="item-info">

            <strong>
                ${skin.name}
            </strong>

            <span>

                ${
                    skin.rarity === "blue"
                    ? "Mil-Spec Grade"
                    :
                    skin.rarity === "purple"
                    ? "Restricted"
                    :
                    skin.rarity === "pink"
                    ? "Classified"
                    :
                    "Covert"
                }

            </span>

        </div>

    `;


    return item;

}

/* =========================================================
   BUILD ROULETTE
========================================================= */

function buildRoulette() {

    const container =
        document.getElementById(
            "items"
        );


    container.innerHTML =
        "";


    for (
        let i = 0;
        i < TOTAL_ITEMS;
        i++
    ) {


        if (
            i === WINNING_INDEX
        ) {

            container.appendChild(
                createKnife()
            );

        }

        else {

            container.appendChild(
                createItem(
                    randomSkin()
                )
            );

        }

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            window.innerWidth / 2
            +
            "px";


        particle.style.top =
            window.innerHeight / 2
            +
            "px";


        particle.style.setProperty(
            "--x",
            (
                (Math.random() - .5)
                *
                1000
            )
            +
            "px"
        );


        particle.style.setProperty(
            "--y",
            (
                (Math.random() - .5)
                *
                700
            )
            +
            "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => particle.remove(),
            1700
        );

    }

}

/* =========================================================
   SPIN
========================================================= */
function updateFocus(){

    const container =
        document.getElementById("items");

    const roulette =
        document.querySelector(".roulette");

    const items =
        container.querySelectorAll(".item");

    const marker =
        roulette.clientWidth/2;

    let closest=null;
    let distance=Infinity;

    items.forEach(item=>{

        const center=
            item.offsetLeft+
            item.offsetWidth/2+
            currentTranslate;

        const d=Math.abs(center-marker);

        item.classList.remove("active");

        if(d<distance){
            distance=d;
            closest=item;
        }

    });

    if(closest)
        closest.classList.add("active");

}

    
    
    
    
function spin(){

    const container =
        document.getElementById("items");

    const roulette =
        document.querySelector(".roulette");

    const allItems =
        container.querySelectorAll(".item");

    const winningItem =
        allItems[WINNING_INDEX];

    const rouletteCenter =
        roulette.clientWidth / 2;

    const winningCenter =
        winningItem.offsetLeft +
        winningItem.offsetWidth / 2;

    const finalPosition =
        rouletteCenter - winningCenter;

    container.style.transition="none";
    container.style.transform="translateX(0px)";
    void container.offsetWidth;

    const duration=9000;

    container.style.transition=
        `transform ${duration}ms cubic-bezier(.04,.78,.08,1)`;

    container.style.transform=
        `translateX(${finalPosition}px)`;

    let tickCount=0;
    let lastTick=performance.now();

    function animateTicks(){

        const elapsed=
            performance.now()-lastTick;

        const progress=
            Math.min(tickCount/85,1);

        const delay=
            40+progress*125;

        if(elapsed>=delay){

            tick(
                Math.max(
                    .018,
                    .065-progress*.035
                )
            );

            tickCount++;
            lastTick=performance.now();

        }

        if(tickCount<85)
            requestAnimationFrame(animateTicks);

    }

    animateTicks();

    setTimeout(()=>{

        container.style.transition="none";
        container.style.transform=
            `translateX(${finalPosition}px)`;

        victorySound();
        createParticles();

        document
            .getElementById("result")
            .classList.add("show");

    },duration+200);

}


    /*
        Ausgangsposition
    */

    container.style.transition =
        "none";


    container.style.transform =
        "translateX(0px)";


    void container.offsetWidth;


    /*
        =================================================
        EXAKTE KNIFE POSITION
        =================================================
    */



    const roulette = document.querySelector(".roulette");
    const rouletteCenter = roulette.clientWidth / 2;

    const winningCenter =
    winningItem.offsetLeft +
    winningItem.offsetWidth / 2;

    const finalPosition = rouletteCenter - winningCenter;



    /*
        =================================================
        SPIN
        =================================================
    */

    const duration =
        9000;


    container.style.transition =
        `
        transform
        ${duration}ms
        cubic-bezier(
            .04,
            .78,
            .08,
            1
        )
        `;


    container.style.transform =
        `translateX(${finalPosition}px)`;


    /*
        =================================================
        TICK SOUNDS
        =================================================
    */

    let tickCount = 0;

    let lastTick =
        performance.now();


    function animateTicks() {

        if (!spinning)
            return;


        const elapsed =
            performance.now()
            -
            lastTick;


        const progress =
            Math.min(
                tickCount / 85,
                1
            );


        const delay =
            40
            +
            progress * 125;


        if (
            elapsed >= delay
        ) {

            tick(
                Math.max(
                    .018,
                    .065
                    -
                    progress * .035
                )
            );


            tickCount++;


            lastTick =
                performance.now();

        }


        if (
            tickCount < 85
        ) {

            requestAnimationFrame(
                animateTicks
            );

        }

    }


    animateTicks();


    /*
        =================================================
        FINISH
        =================================================
    */

    setTimeout(
        () => {

            /*
                Position sichern.
            */

            container.style.transition =
                "none";


            container.style.transform =
                `translateX(${finalPosition}px)`;


            /*
                Sieg
            */

            victorySound();


            /*
                Flash
            */

            const flash =
                document.getElementById(
                    "flash"
                );


            flash.classList.remove(
                "active"
            );


            void flash.offsetWidth;


            flash.classList.add(
                "active"
            );


            /*
                Partikel
            */

            createParticles();


            /*
                Ergebnis
            */

            setTimeout(
                () => {

                    document
                        .getElementById(
                            "result"
                        )
                        .classList.add(
                            "show"
                        );

                },
                350
            );


            spinning =
                false;

        },
        duration + 200
    );

}
